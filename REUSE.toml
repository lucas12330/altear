# Licence de chaque fichier, au format REUSE (https://reuse.software). Explications : LICENCES.md.
# La dernière règle qui correspond à un fichier l'emporte.
version = 1

[[annotations]]
path = "**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Lucas Bezanilla-Bou <contact@altear.tech>"
SPDX-License-Identifier = "AGPL-3.0-only"

[[annotations]]
path = "**/*.html"
precedence = "override"
SPDX-FileCopyrightText = "2026 Lucas Bezanilla-Bou <contact@altear.tech>"
SPDX-License-Identifier = "AGPL-3.0-only AND CC-BY-SA-4.0"

[[annotations]]
path = ["assets/img/**", "**/*.md", "NOTICE"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Lucas Bezanilla-Bou <contact@altear.tech>"
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = ["assets/fonts/inter-*", "assets/fonts/OFL-Inter.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2016 The Inter Project Authors"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["assets/fonts/jetbrains-mono-*", "assets/fonts/OFL-JetBrainsMono.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2020 The JetBrains Mono Project Authors"
SPDX-License-Identifier = "OFL-1.1"
